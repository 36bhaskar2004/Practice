<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Response</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <form action="/" method="POST">
        <div class="container">
            <h1 class="text-center">Response{{pushkey}}</h1>
   <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Name</label>
    <input value="{{res_data['name']}}" type="text" class="form-control" name="name" id="exampleInputPassword1" disabled>
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email</label>
    <input value="{{res_data['email']}}" type="email" class="form-control" name="email" id="exampleInputEmail1" aria-describedby="emailHelp" disabled>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Mob.No</label>
    <input value="{{res_data['mobno']}}" type="number" class="form-control" name="mobno" id="exampleInputPassword1" disabled>
  </div>
</form>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
